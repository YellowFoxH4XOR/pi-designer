name: Release macOS
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-macos
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      PIDESIGNER_RELEASE_BUILD: '1'
      NOTARY_PROFILE: pidesigner-release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release configuration
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          UPDATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE:?Configure MACOS_CERTIFICATE_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Configure MACOS_CERTIFICATE_PASSWORD}"
          : "${APPLE_ID:?Configure APPLE_ID}"
          : "${APPLE_TEAM_ID:?Configure APPLE_TEAM_ID}"
          : "${APPLE_APP_PASSWORD:?Configure APPLE_APP_PASSWORD}"
          : "${UPDATE_KEY:?Configure SPARKLE_PRIVATE_KEY}"
          : "${SPARKLE_PUBLIC_KEY:?Configure SPARKLE_PUBLIC_KEY variable}"
          [[ "$MACOS_SIGNING_IDENTITY" == 'Developer ID Application: '* ]] || { echo 'Configure MACOS_SIGNING_IDENTITY variable.' >&2; exit 1; }
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/release-metadata.py release-info >> "$GITHUB_OUTPUT"
          [[ "$(gh api "repos/$RELEASE_REPOSITORY" --jq '.private')" == false ]] || { echo 'Use a public release repository; private assets cannot be downloaded by the app without credentials.' >&2; exit 1; }
          LATEST="$(gh release list --repo "$RELEASE_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          python3 scripts/release-metadata.py check-newer "${GITHUB_REF_NAME#v}" "$LATEST"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Tests
        run: |
          npm ci --prefix ui
          go test -race ./... && go vet ./...
          (cd ui && npm test && npx tsc --noEmit)
          node --test scripts/tests/*.test.cjs
          python3 -m unittest discover -s scripts/tests -p '*_test.py'
      - name: Import signing credentials into an ephemeral keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/pidesigner-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE" | base64 -D > "$RUNNER_TEMP/pidesigner-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/pidesigner-certificate.p12" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --keychain "$KEYCHAIN" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Build, notarize, package and verify signed updates
        env:
          PIDESIGNER_VERSION: ${{ steps.release.outputs.version }}
          PIDESIGNER_UPDATE_FEED_URL: ${{ steps.release.outputs.feed }}
          UPDATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          export SPARKLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$UPDATE_KEY" > "$SPARKLE_PRIVATE_KEY_FILE"
          unset UPDATE_KEY
          ./scripts/build-mac.sh
          ./scripts/package-mac.sh
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          OUT="build/release/v$VERSION"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Install πDesigner
          Download the Apple silicon `.dmg`, open it, and drag πDesigner into Applications.

          Requires macOS 13 or later and the separately installed pi coding agent (1.1.0 or newer).
          Install pi from https://pi.dev, launch pi and use `/login` to configure your model provider.

          This release is Developer ID signed and notarized. Future releases can be installed from **Settings → App updates** or **πDesigner → Check for Updates…**. Automatic downloads/install-on-quit are optional. Projects remain in your local Application Support directory.
          NOTES
          gh release create "$TAG" --repo "$RELEASE_REPOSITORY" --draft --title "πDesigner $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$OUT/PiDesigner-$VERSION-arm64.dmg" "$OUT/appcast.xml" "$OUT/SHA256SUMS"
          gh release edit "$TAG" --repo "$RELEASE_REPOSITORY" --draft=false --latest
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/pidesigner-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/pidesigner-certificate.p12" "$RUNNER_TEMP/sparkle-private-key"

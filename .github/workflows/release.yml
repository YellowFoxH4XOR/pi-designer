name: Release macOS (free, unnotarized)
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-macos
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || github.repository }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      PIDESIGNER_RELEASE_BUILD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release and optional update signing
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          UPDATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/release-metadata.py release-info >> "$GITHUB_OUTPUT"
          [[ "$(gh api "repos/$RELEASE_REPOSITORY" --jq '.private')" == false ]] || { echo 'Release downloads must be public.' >&2; exit 1; }
          LATEST="$(gh release list --repo "$RELEASE_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          python3 scripts/release-metadata.py check-newer "${GITHUB_REF_NAME#v}" "$LATEST"
          if [[ -n "$UPDATE_KEY" || -n "$SPARKLE_PUBLIC_KEY" ]]; then
            : "${UPDATE_KEY:?Configure SPARKLE_PRIVATE_KEY or remove the public key}"
            : "${SPARKLE_PUBLIC_KEY:?Configure SPARKLE_PUBLIC_KEY or remove the private key}"
            echo 'updates=true' >> "$GITHUB_OUTPUT"
          else
            echo 'updates=false' >> "$GITHUB_OUTPUT"
            echo 'No update-signing keys: publishing a manual-download release with automatic updates disabled.'
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Tests
        run: |
          npm ci --prefix ui
          go test -race ./... && go vet ./...
          (cd ui && npm test && npx tsc --noEmit)
          node --test scripts/tests/*.test.cjs
          python3 -m unittest discover -s scripts/tests -p '*_test.py'
          ./scripts/test-mac.sh
      - name: Build and package unnotarized DMG
        env:
          PIDESIGNER_VERSION: ${{ steps.release.outputs.version }}
          FEED: ${{ steps.release.outputs.feed }}
          UPDATES: ${{ steps.release.outputs.updates }}
          UPDATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$UPDATES" == true ]]; then
            export PIDESIGNER_ENABLE_UPDATES=1
            export PIDESIGNER_UPDATE_FEED_URL="$FEED"
            export SPARKLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/sparkle-private-key"
            printf '%s' "$UPDATE_KEY" > "$SPARKLE_PRIVATE_KEY_FILE"
          fi
          unset UPDATE_KEY
          ./scripts/build-mac.sh
          ./scripts/package-mac.sh
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          OUT="build/release/v$VERSION"
          ASSETS=("$OUT/PiDesigner-$VERSION-arm64.dmg" "$OUT/SHA256SUMS")
          if [[ -f "$OUT/appcast.xml" ]]; then ASSETS+=("$OUT/appcast.xml"); fi
          gh release create "$TAG" --repo "$RELEASE_REPOSITORY" --draft --title "πDesigner $VERSION — unnotarized" --notes-file "$OUT/release-notes.md" "${ASSETS[@]}"
          gh release edit "$TAG" --repo "$RELEASE_REPOSITORY" --draft=false --latest
      - name: Remove optional update signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-private-key"
